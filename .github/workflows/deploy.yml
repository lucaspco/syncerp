name: Deploy to Production

on:
  workflow_run:
    workflows: [ "CI/CD Pipeline" ]
    types: [ completed ]
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            lxc exec syncerp-prod -- bash -c "cd /root/syncerp-docker && docker-compose down && git pull origin main && docker-compose pull && docker-compose up -d --build && echo 'Deploy completed successfully!'"
      
      - name: Verify Deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            lxc exec syncerp-prod -- bash -c "cd /root/syncerp-docker && echo 'Checking container status...' && docker ps -a && echo 'Checking logs...' && docker logs syncerp_app | tail -20"
